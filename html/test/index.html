<!-- static/index.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Go Demo</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 20px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1, h2 { 
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        h2 {
            color: #666;
            font-size: 1.5em;
            margin-bottom: 30px;
        }
        
        .connection-status {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 10px;
        }
        
        .status-connected { background: #28a745; }
        .status-connecting { background: #ffc107; animation: pulse 1.5s infinite; }
        .status-disconnected { background: #dc3545; }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .btn-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 30px 0;
        }
        
        button {
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        
        .btn-success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        
        .btn-warning {
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            color: #333;
        }
        
        .connection-info {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #666;
            max-height: 150px;
            overflow-y: auto;
        }
        
        .messages-container {
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 0;
            margin: 20px 0;
            background: white;
            max-height: 300px;
            display: flex;
            flex-direction: column;
        }
        
        .messages-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 8px 8px 0 0;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        #messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            min-height: 200px;
        }
        
        .message {
            margin: 10px 0;
            padding: 12px 15px;
            border-radius: 10px;
            max-width: 80%;
            word-wrap: break-word;
            position: relative;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { transform: translateY(10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .message-sent {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 2px;
        }
        
        .message-received {
            background: #f1f3f5;
            color: #333;
            margin-right: auto;
            border-bottom-left-radius: 2px;
        }
        
        .message-system {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
            margin: 5px auto;
            max-width: 90%;
            text-align: center;
            font-size: 0.9em;
        }
        
        .message-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            margin: 5px auto;
            max-width: 90%;
        }
        
        .message-time {
            font-size: 0.75em;
            opacity: 0.7;
            margin-top: 5px;
        }
        
        .input-area {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            display: none;
        }
        
        #messageInput {
            flex: 1;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        #messageInput:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .log-entry {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            padding: 5px 0;
            border-bottom: 1px solid #eee;
            color: #666;
        }
        
        .log-timestamp {
            color: #999;
            margin-right: 10px;
        }
        
        .log-info { color: #17a2b8; }
        .log-success { color: #28a745; }
        .log-warning { color: #ffc107; }
        .log-error { color: #dc3545; }
        
        .protocol-info {
            background: #e8f4fd;
            border: 1px solid #b6d4fe;
            border-radius: 8px;
            padding: 10px 15px;
            margin: 10px 0;
            font-size: 14px;
            color: #084298;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>WebRTC 通信演示</h1>
        <h2>基于 Go + Pion WebRTC</h2>
        
        <div class="protocol-info" id="protocolInfo">
            检测到您正在使用 <strong id="protocolType"></strong> 协议
        </div>
        
        <div class="connection-status">
            <div>
                <span class="status-indicator" id="wsStatusIndicator"></span>
                <span id="wsStatusText">WebSocket: 未连接</span>
            </div>
            <div>
                <span class="status-indicator" id="rtcStatusIndicator"></span>
                <span id="rtcStatusText">WebRTC: 未连接</span>
            </div>
            <div>
                <span class="status-indicator" id="dataStatusIndicator"></span>
                <span id="dataStatusText">数据通道: 关闭</span>
            </div>
        </div>
        
        <div class="btn-group">
            <button class="btn-primary" onclick="startAsSender()" id="btnSender">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                </svg>
                作为发送方
            </button>
            
            <button class="btn-secondary" onclick="startAsReceiver()" id="btnReceiver">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 11.08V12a10 10 0 11-5.93-9.14"/>
                    <path d="M22 4L12 14.01l-3-3"/>
                </svg>
                作为接收方
            </button>
            
            <button class="btn-success" onclick="autoConnect()" id="btnAuto">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/>
                    <path d="M15 3h6v6M10 14L21 3"/>
                </svg>
                自动连接
            </button>
            
            <button class="btn-warning" onclick="clearMessages()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                </svg>
                清空消息
            </button>
            
            <button class="btn-danger" onclick="disconnectAll()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18.36 6.64a9 9 0 11-12.73 0M12 2v10"/>
                </svg>
                断开所有连接
            </button>
        </div>
        
        <div class="connection-info">
            <div id="connectionLog"></div>
        </div>
        
        <div class="messages-container">
            <div class="messages-header">
                <span>消息通信</span>
                <span id="messageCount">0 条消息</span>
            </div>
            <div id="messages"></div>
        </div>
        
        <div class="input-area" id="inputArea">
            <input type="text" 
                   id="messageInput" 
                   placeholder="输入消息，按 Enter 发送..." 
                   onkeypress="handleKeyPress(event)"
                   autocomplete="off">
            <button class="btn-primary" onclick="sendMessage()" style="min-width: 100px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                </svg>
                发送
            </button>
        </div>
    </div>

    <script>
        // 全局变量
        let peerConnection = null;
        let dataChannel = null;
        let ws = null;
        let isSender = false;
        let messageCount = 0;
        let protocol = window.location.protocol;
        let wsUrl = '';
        
        // 初始化函数
        function init() {
            // 检测协议并设置WebSocket URL
            detectProtocol();
            
            // 更新协议显示
            document.getElementById('protocolType').textContent = 
                protocol === 'https:' ? 'HTTPS' : 'HTTP';
                
            // 初始状态更新
            updateStatus('ws', 'disconnected');
            updateStatus('rtc', 'disconnected');
            updateStatus('data', 'disconnected');
            
            // 自动连接WebSocket
            connectWebSocket();
            
            logInfo('系统初始化完成');
            logInfo('当前协议: ' + (protocol === 'https:' ? 'HTTPS (安全)' : 'HTTP'));
        }
        
        // 检测当前协议并设置WebSocket URL
        function detectProtocol() {
            const host = window.location.host;
            
            if (protocol === 'https:') {
                // HTTPS环境使用wss
                wsUrl = `wss://${host}/ws`;
                logInfo('检测到HTTPS，使用WSS协议');
            } else {
                // HTTP环境使用ws
                wsUrl = `ws://${host}/ws`;
                logInfo('检测到HTTP，使用WS协议');
            }
            
            logInfo(`WebSocket URL: ${wsUrl}`);
        }
        
        // 连接WebSocket
        function connectWebSocket() {
            // 如果已有连接，先关闭
            if (ws && ws.readyState !== WebSocket.CLOSED) {
                ws.close();
            }
            
            updateStatus('ws', 'connecting');
            logInfo(`正在连接WebSocket: ${wsUrl}`);
            
            try {
                ws = new WebSocket(wsUrl);
                
                ws.onopen = () => {
                    updateStatus('ws', 'connected');
                    logSuccess('WebSocket连接成功');
                    
                    // 启用按钮
                    document.getElementById('btnSender').disabled = false;
                    document.getElementById('btnReceiver').disabled = false;
                    document.getElementById('btnAuto').disabled = false;
                };
                
                ws.onclose = (event) => {
                    updateStatus('ws', 'disconnected');
                    logWarning(`WebSocket连接关闭: ${event.code} - ${event.reason || '无原因'}`);
                    
                    // 禁用按钮
                    document.getElementById('btnSender').disabled = true;
                    document.getElementById('btnReceiver').disabled = true;
                    document.getElementById('btnAuto').disabled = true;
                    
                    // 尝试重新连接
                    setTimeout(() => {
                        if (!ws || ws.readyState === WebSocket.CLOSED) {
                            logInfo('尝试重新连接WebSocket...');
                            connectWebSocket();
                        }
                    }, 3000);
                };
                
                ws.onerror = (error) => {
                    updateStatus('ws', 'disconnected');
                    logError(`WebSocket错误: ${error}`);
                };
                
                ws.onmessage = async (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        logInfo(`收到信号: ${data.type}`);
                        
                        switch (data.type) {
                            case 'offer':
                                await handleOffer(data.sdp);
                                break;
                            case 'answer':
                                await handleAnswer(data.sdp);
                                break;
                            case 'candidate':
                                await handleCandidate(data.candidate);
                                break;
                            default:
                                logWarning(`未知信号类型: ${data.type}`);
                        }
                    } catch (err) {
                        logError(`处理消息失败: ${err.message}`);
                    }
                };
                
            } catch (err) {
                logError(`创建WebSocket连接失败: ${err.message}`);
                updateStatus('ws', 'disconnected');
            }
        }
        
        // 自动连接模式
        async function autoConnect() {
            logInfo('开始自动连接模式...');
            
            // 随机决定作为发送方还是接收方
            isSender = Math.random() > 0.5;
            
            if (isSender) {
                logInfo('自动模式: 作为发送方');
                await startAsSender();
            } else {
                logInfo('自动模式: 作为接收方');
                await startAsReceiver();
            }
        }
        
        // 作为发送方
        async function startAsSender() {
            try {
                if (!ws || ws.readyState !== WebSocket.OPEN) {
                    throw new Error('WebSocket未连接');
                }
                
                isSender = true;
                updateStatus('rtc', 'connecting');
                logInfo('启动发送方模式...');
                
                // 禁用相关按钮
                document.getElementById('btnSender').disabled = true;
                document.getElementById('btnReceiver').disabled = true;
                document.getElementById('btnAuto').disabled = true;
                
                const configuration = {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { urls: 'stun:stun2.l.google.com:19302' }
                    ]
                };
                
                peerConnection = new RTCPeerConnection(configuration);
                
                // 创建数据通道
                dataChannel = peerConnection.createDataChannel('webrtc-chat', {
                    ordered: true,
                    maxRetransmits: 3
                });
                
                setupDataChannel(dataChannel);
                
                // ICE候选人处理
                peerConnection.onicecandidate = (event) => {
                    if (event.candidate && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({
                            type: 'candidate',
                            candidate: event.candidate.candidate
                        }));
                        logInfo('发送ICE候选人');
                    }
                };
                
                // ICE连接状态变化
                peerConnection.oniceconnectionstatechange = () => {
                    const state = peerConnection.iceConnectionState;
                    updateStatus('rtc', state === 'connected' ? 'connected' : 'connecting');
                    logInfo(`ICE连接状态: ${state}`);
                    
                    if (state === 'failed' || state === 'disconnected') {
                        logWarning(`ICE连接${state}，尝试重启...`);
                        setTimeout(() => reconnectRTC(), 2000);
                    }
                };
                
                // 创建并发送Offer
                const offer = await peerConnection.createOffer({
                    offerToReceiveAudio: false,
                    offerToReceiveVideo: false
                });
                
                await peerConnection.setLocalDescription(offer);
                
                ws.send(JSON.stringify({
                    type: 'offer',
                    sdp: offer.sdp
                }));
                
                logSuccess('已发送Offer');
                updateStatus('rtc', 'connecting');
                
            } catch (err) {
                logError(`启动发送方失败: ${err.message}`);
                updateStatus('rtc', 'disconnected');
                resetButtons();
            }
        }
        
        // 作为接收方
        async function startAsReceiver() {
            try {
                if (!ws || ws.readyState !== WebSocket.OPEN) {
                    throw new Error('WebSocket未连接');
                }
                
                isSender = false;
                logInfo('启动接收方模式...');
                
                // 禁用相关按钮
                document.getElementById('btnSender').disabled = true;
                document.getElementById('btnReceiver').disabled = true;
                document.getElementById('btnAuto').disabled = true;
                
                const configuration = {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { urls: 'stun:stun2.l.google.com:19302' }
                    ]
                };
                
                peerConnection = new RTCPeerConnection(configuration);
                
                // 监听数据通道
                peerConnection.ondatachannel = (event) => {
                    dataChannel = event.channel;
                    setupDataChannel(dataChannel);
                    logSuccess('数据通道已连接');
                };
                
                // ICE候选人处理
                peerConnection.onicecandidate = (event) => {
                    if (event.candidate && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({
                            type: 'candidate',
                            candidate: event.candidate.candidate
                        }));
                        logInfo('发送ICE候选人');
                    }
                };
                
                // ICE连接状态变化
                peerConnection.oniceconnectionstatechange = () => {
                    const state = peerConnection.iceConnectionState;
                    updateStatus('rtc', state === 'connected' ? 'connected' : 'connecting');
                    logInfo(`ICE连接状态: ${state}`);
                };
                
                logInfo('等待接收Offer...');
                updateStatus('rtc', 'waiting');
                
            } catch (err) {
                logError(`启动接收方失败: ${err.message}`);
                updateStatus('rtc', 'disconnected');
                resetButtons();
            }
        }
        
        // 处理Offer
        async function handleOffer(sdp) {
            try {
                logInfo('收到Offer请求');
                updateStatus('rtc', 'connecting');
                
                if (!peerConnection) {
                    const configuration = {
                        iceServers: [
                            { urls: 'stun:stun.l.google.com:19302' },
                            { urls: 'stun:stun1.l.google.com:19302' },
                            { urls: 'stun:stun2.l.google.com:19302' }
                        ]
                    };
                    
                    peerConnection = new RTCPeerConnection(configuration);
                    
                    peerConnection.ondatachannel = (event) => {
                        dataChannel = event.channel;
                        setupDataChannel(dataChannel);
                        logSuccess('数据通道已连接');
                    };
                    
                    peerConnection.onicecandidate = (event) => {
                        if (event.candidate && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({
                                type: 'candidate',
                                candidate: event.candidate.candidate
                            }));
                        }
                    };
                    
                    peerConnection.oniceconnectionstatechange = () => {
                        const state = peerConnection.iceConnectionState;
                        updateStatus('rtc', state === 'connected' ? 'connected' : 'connecting');
                    };
                }
                
                await peerConnection.setRemoteDescription({ type: 'offer', sdp: sdp });
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                
                ws.send(JSON.stringify({
                    type: 'answer',
                    sdp: answer.sdp
                }));
                
                logSuccess('已发送Answer');
                
            } catch (err) {
                logError(`处理Offer失败: ${err.message}`);
            }
        }
        
        // 处理Answer
        async function handleAnswer(sdp) {
            try {
                if (!peerConnection) {
                    throw new Error('PeerConnection未初始化');
                }
                
                await peerConnection.setRemoteDescription({ type: 'answer', sdp: sdp });
                logSuccess('WebRTC连接已建立');
                updateStatus('rtc', 'connected');
                
            } catch (err) {
                logError(`处理Answer失败: ${err.message}`);
            }
        }
        
        // 处理ICE候选人
        async function handleCandidate(candidate) {
            try {
                if (peerConnection && peerConnection.remoteDescription) {
                    await peerConnection.addIceCandidate(new RTCIceCandidate({
                        candidate: candidate,
                        sdpMid: '0',
                        sdpMLineIndex: 0
                    }));
                    logInfo('添加ICE候选人成功');
                }
            } catch (err) {
                logWarning(`添加ICE候选人失败: ${err.message}`);
            }
        }
        
        // 设置数据通道
        function setupDataChannel(channel) {
            channel.onopen = () => {
                updateStatus('data', 'connected');
                logSuccess('数据通道已打开');
                document.getElementById('inputArea').style.display = 'flex';
                
                // 发送欢迎消息
                setTimeout(() => {
                    if (channel.readyState === 'open') {
                        const welcomeMsg = isSender ? 
                            '👋 你好！我是发送方' : 
                            '👋 你好！我是接收方';
                        channel.send(welcomeMsg);
                        addMessage(welcomeMsg, 'sent');
                    }
                }, 1000);
            };
            
            channel.onmessage = (event) => {
                addMessage(event.data, 'received');
            };
            
            channel.onclose = () => {
                updateStatus('data', 'disconnected');
                logWarning('数据通道已关闭');
                document.getElementById('inputArea').style.display = 'none';
            };
            
            channel.onerror = (error) => {
                logError(`数据通道错误: ${error}`);
            };
        }
        
        // 发送消息
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (message && dataChannel && dataChannel.readyState === 'open') {
                dataChannel.send(message);
                addMessage(message, 'sent');
                input.value = '';
                input.focus();
            }
        }
        
        // 处理回车键
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
        
        // 断开所有连接
        function disconnectAll() {
            logWarning('断开所有连接...');
            
            if (dataChannel) {
                dataChannel.close();
                dataChannel = null;
            }
            
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            
            updateStatus('rtc', 'disconnected');
            updateStatus('data', 'disconnected');
            document.getElementById('inputArea').style.display = 'none';
            
            resetButtons();
            logSuccess('已断开所有WebRTC连接');
        }
        
        // 重新连接WebRTC
        function reconnectRTC() {
            logInfo('尝试重新连接WebRTC...');
            disconnectAll();
            
            if (isSender) {
                startAsSender();
            } else {
                startAsReceiver();
            }
        }
        
        // 重置按钮状态
        function resetButtons() {
            document.getElementById('btnSender').disabled = !ws || ws.readyState !== WebSocket.OPEN;
            document.getElementById('btnReceiver').disabled = !ws || ws.readyState !== WebSocket.OPEN;
            document.getElementById('btnAuto').disabled = !ws || ws.readyState !== WebSocket.OPEN;
        }
        
        // 更新状态指示器
        function updateStatus(type, status) {
            const indicators = {
                ws: 'wsStatusIndicator',
                rtc: 'rtcStatusIndicator',
                data: 'dataStatusIndicator'
            };
            
            const texts = {
                ws: 'wsStatusText',
                rtc: 'rtcStatusText',
                data: 'dataStatusText'
            };
            
            const statusTexts = {
                ws: {
                    connected: 'WebSocket: 已连接',
                    connecting: 'WebSocket: 连接中...',
                    disconnected: 'WebSocket: 未连接'
                },
                rtc: {
                    connected: 'WebRTC: 已连接',
                    connecting: 'WebRTC: 连接中...',
                    waiting: 'WebRTC: 等待中...',
                    disconnected: 'WebRTC: 未连接'
                },
                data: {
                    connected: '数据通道: 已打开',
                    disconnected: '数据通道: 关闭'
                }
            };
            
            const indicator = document.getElementById(indicators[type]);
            const text = document.getElementById(texts[type]);
            
            // 移除所有状态类
            indicator.classList.remove('status-connected', 'status-connecting', 'status-disconnected');
            
            // 添加新状态类
            indicator.classList.add(`status-${status}`);
            
            // 更新文本
            if (statusTexts[type] && statusTexts[type][status]) {
                text.textContent = statusTexts[type][status];
            }
        }
        
        // 添加消息到消息区域
        function addMessage(text, type) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            const time = new Date().toLocaleTimeString();
            
            messageDiv.className = `message message-${type}`;
            messageDiv.innerHTML = `
                <div>${text}</div>
                <div class="message-time">${time}</div>
            `;
            
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            
            // 更新消息计数
            messageCount++;
            document.getElementById('messageCount').textContent = `${messageCount} 条消息`;
        }
        
        // 添加系统消息
        function addSystemMessage(text) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            const time = new Date().toLocaleTimeString();
            
            messageDiv.className = 'message message-system';
            messageDiv.innerHTML = `
                <div>🔔 ${text}</div>
                <div class="message-time">${time}</div>
            `;
            
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        // 清空消息
        function clearMessages() {
            document.getElementById('messages').innerHTML = '';
            messageCount = 0;
            document.getElementById('messageCount').textContent = '0 条消息';
            logInfo('已清空消息记录');
        }
        
        // 日志函数
        function log(message, type = 'info') {
            const logDiv = document.getElementById('connectionLog');
            const time = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            
            logEntry.className = `log-entry log-${type}`;
            logEntry.innerHTML = `
                <span class="log-timestamp">[${time}]</span>
                <span>${message}</span>
            `;
            
            logDiv.appendChild(logEntry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        function logInfo(message) {
            log(message, 'info');
        }
        
        function logSuccess(message) {
            log(message, 'success');
            addSystemMessage(message);
        }
        
        function logWarning(message) {
            log(message, 'warning');
            addSystemMessage(`⚠️ ${message}`);
        }
        
        function logError(message) {
            log(message, 'error');
            addSystemMessage(`❌ ${message}`);
        }
        
        // 页面加载时初始化
        window.addEventListener('load', init);
    </script>
</body>
</html>
