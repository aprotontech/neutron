<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件浏览器</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus"></script>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
        }

        #app {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .breadcrumb-container {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .breadcrumb-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .breadcrumb-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .breadcrumb-separator {
            color: rgba(255,255,255,0.7);
        }

        .toolbar {
            background: white;
            padding: 15px 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
            flex-wrap: wrap;
        }

        .view-toggle {
            display: flex;
            gap: 10px;
        }

        .view-toggle button {
            padding: 8px 16px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
        }

        .view-toggle button.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .content {
            flex: 1;
            overflow: auto;
            padding: 20px;
        }

        .file-list {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .file-list-header {
            display: grid;
            grid-template-columns: 40px 1fr 120px 120px;
            gap: 20px;
            padding: 15px 20px;
            background: #f9f9f9;
            border-bottom: 1px solid #e0e0e0;
            font-weight: 600;
            color: #333;
            position: sticky;
            top: 0;
        }

        .file-list-item {
            display: grid;
            grid-template-columns: 40px 1fr 120px 120px;
            gap: 20px;
            padding: 12px 20px;
            align-items: center;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: all 0.2s;
        }

        .file-list-item:hover {
            background: #f9f9f9;
        }

        .file-list-item.selected {
            background: #e6f0ff;
        }

        .file-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .file-name {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-size {
            color: #666;
            text-align: right;
            font-size: 14px;
        }

        .file-modified {
            color: #999;
            text-align: right;
            font-size: 14px;
        }

        .thumbnail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
        }

        .thumbnail-item {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.3s;
        }

        .thumbnail-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }

        .thumbnail-item.selected {
            box-shadow: 0 0 0 3px #667eea;
        }

        .thumbnail-preview {
            width: 100%;
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            position: relative;
            overflow: hidden;
        }

        .thumbnail-preview img,
        .thumbnail-preview video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumbnail-icon {
            font-size: 40px;
            color: #999;
        }

        .thumbnail-info {
            padding: 10px;
            border-top: 1px solid #f0f0f0;
        }

        .thumbnail-name {
            font-size: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #333;
            margin-bottom: 5px;
        }

        .thumbnail-size {
            font-size: 11px;
            color: #999;
        }

        .media-viewer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .media-viewer.active {
            display: flex;
        }

        .media-viewer-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .media-viewer-content img,
        .media-viewer-content video {
            max-width: 100%;
            max-height: 100%;
            border-radius: 8px;
        }

        .media-viewer-close {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 32px;
            cursor: pointer;
            background: rgba(0,0,0,0.5);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1001;
        }

        .media-viewer-close:hover {
            background: rgba(0,0,0,0.8);
        }

        .media-viewer-nav {
            position: absolute;
            bottom: 20px;
            color: white;
            font-size: 14px;
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 300px;
            color: #999;
        }

        .empty-icon {
            font-size: 60px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .error-message {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="header">
            <h1>📁 文件浏览器</h1>
            <div class="breadcrumb-container">
                <button class="breadcrumb-btn" @click="goToRoot">根目录</button>
                <template v-for="(path, index) in currentPathArray" :key="index">
                    <span class="breadcrumb-separator">/</span>
                    <button class="breadcrumb-btn" @click="goToPath(index)">{{ path }}</button>
                </template>
            </div>
        </div>

        <div class="toolbar">
            <div class="view-toggle">
                <button 
                    :class="{ active: viewMode === 'list' }" 
                    @click="viewMode = 'list'"
                >
                    📋 列表视图
                </button>
                <button 
                    :class="{ active: viewMode === 'thumbnail' }" 
                    @click="viewMode = 'thumbnail'"
                >
                    🖼️ 缩微图视图
                </button>
            </div>
        </div>

        <div class="content">
            <div v-if="error" class="error-message">
                {{ error }}
            </div>

            <div v-if="loading" class="loading">
                <div class="spinner"></div>
            </div>

            <template v-else-if="files.length > 0">
                <!-- List View -->
                <div v-if="viewMode === 'list'" class="file-list">
                    <div class="file-list-header">
                        <div></div>
                        <div>名称</div>
                        <div>大小</div>
                        <div>修改时间</div>
                    </div>
                    <div 
                        v-for="file in files" 
                        :key="file.name"
                        class="file-list-item"
                        :class="{ selected: selectedFile === file }"
                        @click="selectFile(file)"
                        @dblclick="openFile(file)"
                    >
                        <div class="file-icon">
                            {{ getFileIcon(file) }}
                        </div>
                        <div class="file-name">
                            {{ file.name }}
                        </div>
                        <div class="file-size">
                            {{ formatSize(file.size) }}
                        </div>
                        <div class="file-modified">
                            {{ formatDate(file.modTime) }}
                        </div>
                    </div>
                </div>

                <!-- Thumbnail View -->
                <div v-else class="thumbnail-grid">
                    <div 
                        v-for="file in files" 
                        :key="file.name"
                        class="thumbnail-item"
                        :class="{ selected: selectedFile === file }"
                        @click="selectFile(file)"
                        @dblclick="openFile(file)"
                    >
                        <div class="thumbnail-preview">
                            <img 
                                v-if="isImage(file) && file.thumbnailData" 
                                :src="file.thumbnailData"
                                :alt="file.name"
                            >
                            <video 
                                v-else-if="isVideo(file)" 
                                :src="getFileUrl(file)"
                                controls
                            ></video>
                            <div v-else class="thumbnail-icon">
                                {{ getFileIcon(file) }}
                            </div>
                        </div>
                        <div class="thumbnail-info">
                            <div class="thumbnail-name" :title="file.name">
                                {{ file.name }}
                            </div>
                            <div class="thumbnail-size">
                                {{ formatSize(file.size) }}
                            </div>
                        </div>
                    </div>
                </div>
            </template>

            <div v-else class="empty-state">
                <div class="empty-icon">📭</div>
                <div>文件夹为空</div>
            </div>
        </div>
    </div>

    <!-- Media Viewer -->
    <div id="media-viewer" class="media-viewer">
        <button class="media-viewer-close" @click="closeMediaViewer">✕</button>
        <div class="media-viewer-content">
            <img 
                v-if="isViewingImage" 
                :src="currentMediaUrl"
                :alt="currentMediaFile.name"
            >
            <video 
                v-else-if="isViewingVideo" 
                :src="currentMediaUrl"
                controls
                autoplay
            ></video>
        </div>
        <div class="media-viewer-nav" v-if="currentMediaFile">
            {{ currentMediaFile.name }}
        </div>
    </div>

    <script src="js/api/file-api.js"></script>
    <script src="js/api/webrtc-dc-rpc.js"></script>
    <script src="js/api/webrtc-dc-file.js"></script>
    <script src="js/api/webrtc-client.js"></script>
    <script src="js/api/http-client.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
