syntax = "proto3";

package neutron;

option go_package = "github.com/aproton/neutron/pkg/proto";


message WebRTCOfferContent {
    string sdp = 1;
}

message WebRTCAnswerContent {
    string sdp = 1;
}

message WebRTCAnswerCandidatesContent {
    string sdp = 1;
    string type = 2;
}

message WebRTCCandidateContent {
    string candidate = 1;
}

