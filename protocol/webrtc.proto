syntax = "proto3";

import "google/protobuf/struct.proto";

option go_package = "github.com/aproton/neutron/pkg/proto";
option optimize_for = SPEED;

package neutron;

// Candidate message for ICE candidates
message Candidate {
    string candidate = 1;
    string sdp_mid = 2;
    int32 sdp_m_line_index = 3;
    string username_fragment = 4;
}

// WebRTC signaling messages
message WebRTCOffer {
    string sdp = 1;
    repeated Candidate candidates = 2;
}

message WebRTCAnswer {
    string sdp = 1;
    repeated Candidate candidates = 2;
}

// WebRTC file transfer request
message FileTransferRequest {
    string path = 1;
    string label = 2;
    int64 offset = 3;
    int64 size = 4;
    string mime_type = 5;
}

// WebRTC file transfer response
message FileTransferResponse {
    bool success = 1;
    int64 size = 2;
    string error = 3;
    string id = 4;
}

// Thumbnail request
message ThumbnailRequest {
    string path = 1;
    int32 max_size = 2;
}

// Thumbnail response
message ThumbnailResponse {
    string id = 1;
    int32 width = 2;
    int32 height = 3;
    string error = 4;
}

