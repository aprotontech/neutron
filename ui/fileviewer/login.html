<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; background:#f5f7fa; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
        .card { background:white; padding:24px; border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,0.08); width:320px; }
        .card h2 { margin:0 0 12px 0; font-size:20px; }
        .form-group { margin-bottom:12px; }
        label { display:block; margin-bottom:6px; font-size:13px; color:#333; }
        input[type=text], input[type=password] { width:100%; padding:8px 10px; border:1px solid #ddd; border-radius:4px; }
        button { width:100%; padding:10px; border:none; border-radius:4px; background:#667eea; color:white; font-weight:600; cursor:pointer; }
        .error { color:#c33; margin-top:8px; font-size:13px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>登录</h2>
        <div class="form-group">
            <label>用户名</label>
            <input id="username" type="text" autocomplete="username">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input id="password" type="password" autocomplete="current-password">
        </div>
        <button id="loginBtn">登录</button>
        <div id="error" class="error" style="display:none;"></div>
    </div>

    <script>
        const loginBtn = document.getElementById('loginBtn');
        const errEl = document.getElementById('error');

        loginBtn.addEventListener('click', async () => {
            errEl.style.display = 'none';
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            if (!username || !password) {
                errEl.textContent = '请输入用户名和密码';
                errEl.style.display = 'block';
                return;
            }

            try {
                const resp = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (resp.status === 200) {
                    const data = await resp.json();
                    if (data && data.token) {
                        localStorage.setItem('token', data.token);
                        // redirect to root or file viewer index
                        window.location.href = '/';
                        return;
                    }
                    errEl.textContent = '登录成功，但未返回 token';
                    errEl.style.display = 'block';
                    return;
                } else if (resp.status === 401) {
                    errEl.textContent = '用户名或密码错误';
                    errEl.style.display = 'block';
                } else {
                    const text = await resp.text();
                    errEl.textContent = '登录失败: ' + (text || resp.status);
                    errEl.style.display = 'block';
                }
            } catch (e) {
                errEl.textContent = '网络错误: ' + e.message;
                errEl.style.display = 'block';
            }
        });

        // If already logged in, redirect
        (function(){
            const t = localStorage.getItem('token');
            if (t) window.location.href = '/';
        })();
    </script>
</body>
</html>
